model_list:
  - model_name: chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY
  - model_name: chat-backup
    litellm_params:
      model: openai/gpt-5.4-mini
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY
  - model_name: embed-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_base: os.environ/GATEWAY_BASE_URL
      api_key: os.environ/GATEWAY_API_KEY

router_settings:
  fallbacks: [{"chat": ["chat-backup"]}]
  num_retries: 2

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 86400

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
